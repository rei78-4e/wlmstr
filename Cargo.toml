[package]
name = "wlmstr"
version = "0.9.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "wlmstr"
path = "src/main.rs"

[[bin]]
name = "wlmstr-gui"
path = "src/bin/wlmstr-gui.rs"
required-features = ["gui"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
itertools = "0.15"
rand = "0.10.1"
easy_storage = "0.5.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
procfs = "0.18"
libc = "0.2.186"
xdg = "3.0.0"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_10"], optional = true }

[features]
gui = ["dep:gtk"]
